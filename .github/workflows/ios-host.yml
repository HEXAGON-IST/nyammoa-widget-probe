name: Free iOS OS-host observation
on:
  workflow_dispatch:
    inputs:
      signing:
        description: Simulator signing experiment (no Apple account)
        type: choice
        default: unsigned
        options:
          - unsigned
          - adhoc-local
permissions:
  contents: read
concurrency:
  group: ios-host-observation
  cancel-in-progress: true
jobs:
  host:
    if: ${{ github.event.repository.private == false }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run actual OS-host tests and emit temporary screenshots in logs
        env:
          PROBE_SIGNING: ${{ inputs.signing }}
        run: python3 ios/run-host.py
